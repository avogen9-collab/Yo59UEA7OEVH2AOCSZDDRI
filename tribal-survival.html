<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2e2a33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tribal Survival</title>
<style>
:root{--ol:#2e2a33;--panel:rgba(38,32,46,.88);--panel2:#3d3449;--acc:#ffb23e;--ok:#7bd36a;--bad:#ff6b6b;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1d1a22;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#fff;touch-action:none;overscroll-behavior:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;padding:0}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud button,#hotbar .slot{pointer-events:auto}
#tl{position:absolute;left:calc(10px + var(--sal));top:calc(8px + var(--sat));width:158px;display:flex;flex-direction:column;gap:5px}
.bar{position:relative;height:22px;background:rgba(30,25,38,.85);border:3px solid var(--ol);border-radius:12px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;background:linear-gradient(#f77b82,#d2404b);transition:width .18s}
.bar.xp{height:18px}.bar.xp i{background:linear-gradient(#ffd77a,#f0962a)}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;text-shadow:0 1px 0 #000,1px 0 #000,-1px 0 #000,0 -1px #000;letter-spacing:.2px}
.bar.low i{animation:blink .6s infinite alternate}
@keyframes blink{to{filter:brightness(1.7)}}
.pill{display:flex;align-items:center;gap:6px;padding:3px 9px;background:var(--panel);border:3px solid var(--ol);border-radius:12px;font-weight:800;font-size:13px;width:max-content;max-width:100%}
#clock{font-size:14px;flex-wrap:wrap}
#clkI{font-size:17px;line-height:1}
#clkS{font-size:11px;font-weight:700;opacity:.85;flex-basis:100%}
#tr{position:absolute;right:calc(10px + var(--sar));top:calc(8px + var(--sat));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#res{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.rc{display:flex;align-items:center;gap:4px;background:var(--panel);border:3px solid var(--ol);border-radius:11px;padding:0 8px 0 3px;font-weight:900;font-size:15px;min-width:72px;height:30px}
.rc img{width:23px;height:23px;image-rendering:auto}
.rc b{flex:1;text-align:right}
.rc.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.22);background:#5a4a2a}}
.rb{width:56px;height:56px;border-radius:50%;border:3px solid var(--ol);background:var(--panel2);display:grid;place-items:center;position:relative;box-shadow:0 3px 0 #0006;font-weight:900}
.rb:active{transform:translateY(2px);box-shadow:0 1px 0 #0006}
.rb img{width:36px;height:36px}
.rb.sm{width:42px;height:42px;font-size:15px}
.rb.red{background:#c9484b}
.rb .bd{position:absolute;right:-4px;bottom:-4px;min-width:22px;height:20px;padding:0 4px;border-radius:10px;background:var(--acc);color:#2e2a33;border:2px solid var(--ol);font-size:11px;line-height:16px;font-weight:900}
#side{position:absolute;right:calc(10px + var(--sar));bottom:calc(200px + var(--sab));display:flex;flex-direction:column;gap:9px;align-items:center}
#hotbar{position:absolute;left:50%;bottom:calc(10px + var(--sab));transform:translateX(-50%);display:flex;gap:6px}
.slot{width:48px;height:48px;border-radius:12px;border:3px solid var(--ol);background:var(--panel);position:relative;display:grid;place-items:center}
.slot img{width:36px;height:36px}
.slot.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.slot.no img{opacity:.45}
.slot.no::after{content:"";position:absolute;inset:0;border-radius:9px;background:rgba(220,60,60,.25)}
#toast{position:absolute;top:calc(var(--sat) + 150px);left:50%;transform:translateX(-50%);max-width:min(86vw,360px);text-align:center;font-weight:800;font-size:14px;padding:7px 14px;background:var(--panel);border:3px solid var(--ol);border-radius:14px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
#banner{position:absolute;top:30%;left:0;right:0;text-align:center;pointer-events:none;opacity:0}
#banner h1{margin:0;font-size:clamp(28px,9vw,54px);font-weight:900;color:#ffd36e;-webkit-text-stroke:3px var(--ol);paint-order:stroke fill;text-shadow:0 5px 0 var(--ol)}
#banner p{margin:6px 0 0;font-size:15px;font-weight:800;text-shadow:0 2px 0 #000,0 0 6px #000}
#banner.show{animation:ban 2.6s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
#status{position:absolute;left:calc(10px + var(--sal));top:calc(var(--sat) + 150px);display:flex;flex-direction:column;gap:4px}
#status .st{background:var(--panel);border:3px solid var(--ol);border-radius:10px;padding:1px 8px;font-size:12px;font-weight:800;width:max-content}
#status .st.cold{background:#2d4a78}
#sheet{position:fixed;left:0;right:0;bottom:0;height:min(66vh,580px);background:#2a2433;border-top:4px solid var(--ol);border-radius:20px 20px 0 0;z-index:20;display:flex;flex-direction:column;padding-bottom:var(--sab);animation:up .22s ease-out;touch-action:none}
@keyframes up{from{transform:translateY(50px);opacity:0}}
#shead{display:flex;align-items:center;gap:6px;padding:9px 10px 4px}
#stabs{display:flex;gap:5px;flex:1}
.tab{flex:1;padding:8px 2px;border:3px solid var(--ol);border-radius:12px;background:var(--panel2);font-weight:900;font-size:13px;white-space:nowrap}
.tab.on{background:var(--acc);color:#2e2a33}
#sclose{width:42px;height:42px;border-radius:50%;border:3px solid var(--ol);background:#d9534f;font-weight:900;font-size:16px}
#sinfo{display:flex;gap:8px;padding:2px 12px 6px;font-size:12px;font-weight:800;align-items:center;opacity:.95;flex-wrap:wrap}
#sinfo img{width:18px;height:18px;vertical-align:middle;margin-right:2px}
#sgrid{overflow-y:auto;touch-action:pan-y;padding:4px 10px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;flex:1;align-content:start}
.card{background:var(--panel2);border:3px solid var(--ol);border-radius:14px;padding:7px;display:flex;flex-direction:column;gap:3px;position:relative;min-height:128px;cursor:pointer}
.card .top{display:flex;gap:7px;align-items:center}
.card img.ic{width:46px;height:46px;flex:none;background:#2a2433;border-radius:10px;border:2px solid var(--ol)}
.card .nm{font-weight:900;font-size:13px;line-height:1.1}
.card .ds{font-size:11px;opacity:.8;line-height:1.15;min-height:26px}
.card .cs{display:flex;flex-wrap:wrap;gap:3px}
.chip{display:inline-flex;align-items:center;gap:1px;font-size:11px;font-weight:900;background:#241f2d;border-radius:8px;padding:1px 5px 1px 1px}
.chip img{width:16px;height:16px}
.chip.no{color:var(--bad)}
.card .go{margin-top:auto;text-align:center;font-weight:900;font-size:12px;padding:5px;border-radius:9px;border:2px solid var(--ol);background:var(--acc);color:#2e2a33}
.card.eq{border-color:var(--ok)}.card.eq .go{background:var(--ok)}
.card.own .go{background:#6aa8ff}
.card.cant .go{background:#6b6477;color:#d3cdd9}
.card.lock{opacity:.55}.card.lock .go{background:#4a4355;color:#bbb}
.card.sel{border-color:var(--acc)}
.modal{position:fixed;inset:0;background:rgba(14,11,20,.78);display:grid;place-items:center;z-index:30;padding:14px;overflow-y:auto}
.box{background:#2a2433;border:4px solid var(--ol);border-radius:22px;padding:18px 16px;width:min(94vw,440px);text-align:center;box-shadow:0 8px 0 #0007;animation:pup .25s ease-out}
@keyframes pup{from{transform:scale(.85);opacity:0}}
.box h2{margin:0 0 4px;font-size:26px;font-weight:900;color:#ffd36e}
.box p{margin:4px 0 10px;font-size:14px;line-height:1.35;opacity:.92}
.title{font-size:clamp(46px,16vw,76px);font-weight:900;margin:0;color:#ffd36e;-webkit-text-stroke:5px var(--ol);paint-order:stroke fill;text-shadow:0 7px 0 var(--ol);letter-spacing:2px;line-height:1}
.btn{display:block;width:100%;margin-top:10px;padding:13px;border-radius:14px;border:3px solid var(--ol);background:var(--acc);color:#2e2a33;font-weight:900;font-size:18px;box-shadow:0 4px 0 #0007}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0007}
.btn.alt{background:var(--panel2);color:#fff;font-size:15px}
.perks{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.perk{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel2);border:3px solid var(--ol);border-radius:14px;padding:9px 10px}
.perk .pi{font-size:28px;width:40px;text-align:center}
.perk b{display:block;font-size:15px}
.perk span{font-size:12px;opacity:.85}
.perk:active{border-color:var(--acc)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.stats div{background:var(--panel2);border:3px solid var(--ol);border-radius:12px;padding:6px;font-size:12px;font-weight:700}
.stats b{display:block;font-size:20px;color:var(--acc)}
.help{text-align:left;font-size:13px;line-height:1.4}
.help li{margin:3px 0}
@media (max-height:520px){#side{bottom:calc(70px + var(--sab));flex-direction:column}#toast{top:calc(var(--sat) + 10px)}.rc{height:26px;font-size:13px}.rb{width:48px;height:48px}.rb img{width:30px;height:30px}#sheet{height:78vh}}

/* ---- v2: крупные кнопки, удар, миникарта, меню ---- */
.rb{width:64px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.rb img{width:34px;height:34px}
.rb .lb{font-size:9px;font-weight:900;line-height:1;margin-top:1px;text-shadow:0 1px 0 #000}
.rb.sm{width:44px;height:44px;font-size:15px}
#side{bottom:calc(150px + var(--sab));gap:8px}
#bAtk{position:absolute;right:calc(10px + var(--sar));bottom:calc(30px + var(--sab));width:92px;height:92px;border-radius:50%;border:4px solid var(--ol);background:radial-gradient(circle at 35% 30%,#ff9a8a,#d9453d);font-weight:900;font-size:17px;letter-spacing:.5px;box-shadow:0 6px 0 #0007,inset 0 -6px 0 rgba(0,0,0,.15);pointer-events:auto;touch-action:none;text-shadow:0 2px 0 rgba(0,0,0,.45)}
#bAtk.down{transform:translateY(4px);box-shadow:0 2px 0 #0007;filter:brightness(1.15)}
#bAtk.build{background:radial-gradient(circle at 35% 30%,#b6f7a6,#3fa84a)}
#bAtk.clear{background:radial-gradient(circle at 35% 30%,#ffd88a,#d98a1f)}
#mini{width:98px;height:98px;border:3px solid var(--ol);border-radius:14px;background:#223;box-shadow:0 3px 0 #0006}
#wbar{position:absolute;left:50%;bottom:calc(68px + var(--sab));transform:translateX(-50%);display:flex;gap:5px;max-width:min(52vw,191px);overflow-x:auto;pointer-events:auto;touch-action:pan-x;padding:2px}
#wbar::-webkit-scrollbar{display:none}
#hotbar{gap:5px}
#hotbar .slot,#wbar .slot{width:44px;height:44px;flex:none;pointer-events:auto}
#wbar .slot{background:rgba(52,42,66,.9)}
#toast{top:calc(var(--sat) + 205px)}
#status{top:calc(var(--sat) + 190px)}
body.big .rb{width:76px;height:76px}body.big .rb img{width:42px;height:42px}body.big #bAtk{width:112px;height:112px;font-size:19px}body.big #side{bottom:calc(172px + var(--sab))}
body.big .slot{width:54px!important;height:54px!important}body.big .slot img{width:42px;height:42px}
.title{font-size:clamp(40px,13vw,66px);line-height:1.02;margin:4px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0 4px}
.chips span{background:var(--panel2);border:2px solid var(--ol);border-radius:10px;padding:3px 8px;font-size:12px;font-weight:800}
.btn.big{font-size:22px;padding:16px;margin-top:14px;background:linear-gradient(#ffc866,#f09a2a)}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}
.tog{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 14px;margin-top:8px;border-radius:14px;border:3px solid var(--ol);background:var(--panel2);font-weight:900;font-size:15px}
.tog b{padding:2px 10px;border-radius:9px;background:#5a5266;font-size:13px}
.tog.on b{background:var(--ok);color:#1f2a1f}
.best{margin-top:10px;font-size:12px;opacity:.8}
.mst{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:6px 0 4px}
.mst div{background:var(--panel2);border:2px solid var(--ol);border-radius:10px;padding:5px 2px;font-size:10px;font-weight:700}
.mst b{display:block;font-size:16px;color:var(--acc)}
@media (max-height:760px){#mini{display:none}#side{bottom:calc(140px + var(--sab));gap:6px}.rb{width:56px;height:56px}.rb .lb{display:none}.rb img{width:34px;height:34px}}
@media (max-height:520px){#side{right:calc(122px + var(--sar));bottom:calc(14px + var(--sab));flex-direction:row-reverse}#hotbar,#wbar{left:calc(10px + var(--sal));transform:none}#wbar{bottom:calc(64px + var(--sab))}#bAtk{width:84px;height:84px;bottom:calc(14px + var(--sab))}}

/* ---- v3: рюкзак, админка, промокод ---- */
input{-webkit-user-select:text;user-select:text}
.trow{display:flex;gap:6px}
.rb.sm img{width:28px;height:28px}
#bAdm{background:#8f2b36;font-size:11px;letter-spacing:.3px}
.inp{width:100%;padding:11px 12px;border-radius:12px;border:3px solid var(--ol);background:#1f1a27;color:#fff;font:inherit;font-weight:800;font-size:15px;min-width:0}
.promo{display:flex;gap:6px;margin-top:12px;align-items:stretch}
.promo .btn{margin:0;width:auto;padding:0 18px;font-size:15px}
.pmsg{min-height:18px;font-size:12px;font-weight:800;margin-top:5px}
.sec{font-weight:900;font-size:13px;margin:10px 0 4px;text-align:left;opacity:.85}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.agrid button{padding:10px 4px;border-radius:11px;border:3px solid var(--ol);background:var(--panel2);font-weight:900;font-size:13px}
.agrid button.on{background:var(--ok);color:#1f2a1f}
.agrid button:active{transform:translateY(2px)}
.agrid .w2{grid-column:span 2}
.agrid img{width:18px;height:18px;vertical-align:middle;margin-right:2px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
.pc{background:var(--panel2);border:3px solid var(--ol);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:5px}
.pc.eq{border-color:var(--ok)}
.pc img{width:40px;height:40px;background:#2a2433;border-radius:9px;border:2px solid var(--ol);flex:none}
.pc .nm{font-weight:900;font-size:13px;line-height:1.1}
.pc .st2{font-size:11px;opacity:.8}
.pc .pb{display:flex;gap:5px}
.pc .pb button{flex:1;padding:7px 2px;border-radius:9px;border:2px solid var(--ol);font-weight:900;font-size:12px;background:var(--acc);color:#2e2a33}
.pc.eq .pb button[data-a=eq]{background:var(--ok)}
.pc .pb .del{flex:0 0 42px;background:#c9484b;color:#fff}
.pc .pb .del.ask{flex:1;background:#ff3b3b}
.pres{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:4px 0}
.pres .chip{font-size:12px}
.btn.danger{background:#c9484b;color:#fff;font-size:14px}
.btn.danger.ask{background:#ff3b3b}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hidden">
 <div id="tl">
  <div class="bar" id="hpBar"><i id="hpF"></i><span id="hpT"></span></div>
  <div class="bar xp"><i id="xpF"></i><span id="xpT"></span></div>
  <div class="pill" id="clock"><span id="clkI">☀️</span><span id="clkT"></span><span id="clkS"></span></div>
  <div class="pill" id="kills" style="font-size:12px"></div>
 </div>
 <div id="tr">
  <div class="trow"><button class="rb sm hidden" id="bAdm">ADM</button><button class="rb sm" id="bPack"></button><button class="rb sm" id="bMenu">❚❚</button></div>
  <canvas id="mini" width="196" height="196"></canvas>
  <div id="res"></div>
 </div>
 <div id="status"></div>
 <div id="toast"></div>
 <div id="banner"><h1 id="banT"></h1><p id="banS"></p></div>
 <div id="side">
  <button class="rb red hidden" id="bCancel">✕</button>
  <button class="rb" id="bEat"></button>
  <button class="rb" id="bCraft"></button>
  <button class="rb" id="bBuild"></button>
  <button class="rb" id="bWeap"></button>
 </div>
 <button id="bAtk">УДАР</button>
 <div id="wbar"></div>
 <div id="hotbar"></div>
</div>
<div id="sheet" class="hidden">
 <div id="shead"><div id="stabs"></div><button id="sclose">✕</button></div>
 <div id="sinfo"></div>
 <div id="sgrid"></div>
</div>
<div class="modal hidden" id="modal"><div class="box" id="mbox"></div></div>
<script>
'use strict';
/* ===================== УТИЛИТЫ ===================== */
const TAU=Math.PI*2,PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const irand=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const pickR=a=>a[(Math.random()*a.length)|0];
const dist=(a,b,c2,d)=>Math.hypot(c2-a,d-b);
function angDiff(a,b){let d=(b-a)%TAU;if(d>PI)d-=TAU;if(d<-PI)d+=TAU;return d}
function hash2(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
const fmt=n=>n>=10000?Math.floor(n/1000)+'k':''+n;
const $=id=>document.getElementById(id);

class Grid{
 constructor(cs){this.cs=cs;this.m=new Map()}
 add(o){const k=((o.x/this.cs)|0)*4096+((o.y/this.cs)|0);let a=this.m.get(k);if(!a)this.m.set(k,a=[]);a.push(o);o._k=k}
 remove(o){const a=this.m.get(o._k);if(a){const i=a.indexOf(o);if(i>=0)a.splice(i,1)}}
 query(x,y,r,fn){const cs=this.cs,x0=Math.max(0,((x-r)/cs)|0),x1=((x+r)/cs)|0,y0=Math.max(0,((y-r)/cs)|0),y1=((y+r)/cs)|0;
  for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){const a=this.m.get(cx*4096+cy);if(a)for(let i=0;i<a.length;i++)fn(a[i])}}
}

/* ===================== КАРТА ===================== */
const MAP=8000,CELL=64,DAY_LEN=300,HOUR0=7.5,RW=230,K=MAP/6400;
const SP={x:MAP/2,y:Math.round(2350*K)};
const snowEdge=x=>{x/=K;return(1450+Math.sin(x*.0021)*130+Math.sin(x*.0057+1)*55)*K};
const desertEdge=x=>{x/=K;return(4750+Math.sin(x*.0017+2)*150+Math.sin(x*.0049)*60)*K};
const riverY=x=>{x/=K;return(3250+Math.sin(x*.0016)*260+Math.sin(x*.0043+1.3)*90)*K};
let ponds=[],forests=[],rocky=[];
function inWater(x,y){if(Math.abs(y-riverY(x))<RW/2)return true;for(let i=0;i<ponds.length;i++){const p=ponds[i],dx=x-p.x,dy=y-p.y;if(dx*dx+dy*dy<p.r*p.r)return true}return false}
const biomeAt=(x,y)=>y<snowEdge(x)?'snow':y>desertEdge(x)?'desert':'grass';

/* ===================== ДАННЫЕ ===================== */
const RKEYS=['wood','food','stone','gold','iron'];
const RN={wood:'Дерево',food:'Еда',stone:'Камень',gold:'Золото',iron:'Железо'};
const AGES=['Новичок','Собиратель','Охотник','Каменотёс','Воин','Кузнец','Рыцарь','Страж','Ветеран','Легенда'];
const xpNeed=a=>50+a*a*28;
// тип ресурса: res — что даёт, tier — нужный уровень инструмента, org — органика (дерево/еда)

function okPos(x,y,r){
 if(x<110||y<110||x>MAP-110||y>MAP-110)return false;
 if(inWater(x,y)||inWater(x+r+16,y)||inWater(x-r-16,y)||inWater(x,y+r+16)||inWater(x,y-r-16))return false;
 if(Math.hypot(x-SP.x,y-SP.y)<130)return false;
 for(const L of LAIRS)if(Math.hypot(x-L.x,y-L.y)<330)return false;
 let ok=true;
 grid.query(x,y,r+90,o=>{if(Math.hypot(o.x-x,o.y-y)<(o.r+r)*.85)ok=false});
 return ok;
}

 while(ok<n&&tries<n*14){tries++;const q=gen(),b=biomeAt(q.x,q.y);const type=typeof tf==='string'?tf:tf(b);if(!type)continue;
  const r=rand(rmin,rmax);if(!okPos(q.x,q.y,r))continue;addRes(type,q.x,q.y,r,irand(0,2),b);ok++}
}

/* ===================== СТОЛКНОВЕНИЯ ===================== */
function pushCircle(e,ox,oy,or){
 const dx=e.x-ox,dy=e.y-oy,m=e.r+or,d2=dx*dx+dy*dy;
 if(d2>=m*m)return false;
 const d=Math.sqrt(d2)||.001;const k=(m-d)/d;e.x+=dx*k;e.y+=dy*k;return true;
}
function pushBox(e,ox,oy,hs){
 const cx=clamp(e.x,ox-hs,ox+hs),cy=clamp(e.y,oy-hs,oy+hs);
 const dx=e.x-cx,dy=e.y-cy,d2=dx*dx+dy*dy;
 if(d2>=e.r*e.r)return false;
 if(d2>1e-6){const d=Math.sqrt(d2),k=(e.r-d)/d;e.x+=dx*k;e.y+=dy*k}
 else{const px=hs-Math.abs(e.x-ox),py=hs-Math.abs(e.y-oy);if(px<py)e.x+=(e.x>ox?1:-1)*(px+e.r);else e.y+=(e.y>oy?1:-1)*(py+e.r)}
 return true;
}
function collide(e,isP){
 grid.query(e.x,e.y,e.r+44,o=>{
  if(o.cls==='res'){pushCircle(e,o.x,o.y,o.cr);return}
  if(o.dead)return;const d=o.def;
  if(isP&&d.k==='gate')return;
  const hit=d.circle?pushCircle(e,o.x,o.y,d.circle):pushBox(e,o.x,o.y,32);
  if(hit&&!isP&&!e.touch)e.touch=o;
 });
}

function canPlace(def,gx,gy){
 const x=gx*CELL,y=gy*CELL;
 if(x<100||y<100||x>MAP-100||y>MAP-100)return 'Край карты';
 if(occ.has(gx+','+gy))return 'Место занято';
 if(BLD.length>=G.maxBld)return 'Лимит построек';
 if(inWater(x,y)||inWater(x+28,y+28)||inWater(x-28,y-28)||inWater(x+28,y-28)||inWater(x-28,y+28))return 'На воде строить нельзя';
 let bad=false;
 grid.query(x,y,110,o=>{if(o.cls==='res'&&Math.hypot(o.x-x,o.y-y)<o.cr+(def.circle||30)+4)bad=true});

 let best=null,bd=1e9;
 for(const m of MOBS){if(m.dead||m.def.ai==='pas')continue;const dx=m.x-P.x,dy=m.y-P.y,d=Math.hypot(dx,dy)-m.r;if(d>range+26)continue;
  const da=Math.abs(angDiff(a,Math.atan2(dy,dx)));if(da<cone&&d<bd){bd=d;best=m}}

 P.hitA=SET.aim?assistAim(P.aim,rng,IN.aimOn?.62:1.0):P.aim;P.face=P.hitA;

  for(let i=0;i<5;i++){const aa=a+rand(-.28,.28),sp2=rand(200,340);PARTS.push({x:P.x+Math.cos(a)*24,y:P.y+Math.sin(a)*24,vx:Math.cos(aa)*sp2,vy:Math.sin(aa)*sp2,life:.35,max:.35,s:rand(5,9),col:Math.random()<.5?'#ff8a2a':'#ffd35a',k:2})}
  sfx('swing');return;
 }
 const rng=w.rng*(1+P.pk.reach);
 P.slash={a,t:.2,r:rng+14,w:w.aoe?1:0,wide:w.wide?1:0};
 let hitM=false;
 for(const m of MOBS){

  else{if(d-m.r>rng)continue;if(d>m.r+28&&Math.abs(angDiff(a,Math.atan2(dy,dx)))>(w.wide?1.7:.95))continue}

 }
 if(w.aoe){ringFx(P.x,P.y,w.aoe,'#fff');G.shake=Math.max(G.shake,6)}

 grid.query(P.x,P.y,rng+90,o=>{

 });
 if(best)gather(best,w);

function updatePlayer(dt){

 p.cd-=dt;p.since+=dt;p.inv=Math.max(0,p.inv-dt);p.bob+=dt;p.thT-=dt;
 for(const k of ['dmg','spd','def','reg'])if(p.bt[k]>0){p.bt[k]-=dt;if(p.bt[k]<=0)p.buf[k]=0}

 p.vx+=(tvx-p.vx)*k;p.vy+=(tvy-p.vy)*k;

 if(p.slash){p.slash.t-=dt;if(p.slash.t<=0)p.slash=null}
 // регенерация
 const rg=(p.since>5?.6:0)+p.pk.regen+gs('regen')+p.buf.reg;
 if(rg>0&&p.hp<p.maxhp)p.hp=Math.min(p.maxhp,p.hp+rg*dt);
 // холод и кактусы
 if(biomeAt(p.x,p.y)==='snow'&&!isWarm()){
  G.cold=Math.min(1,G.cold+dt*.4);
  if(!G.flags.cold){G.flags.cold=1;toast('❄ Холодно! Нужна тёплая одежда или костёр')}
  if(G.cold>=1){G.coldT-=dt;if(G.coldT<=0){G.coldT=1.2;if(!p.god){p.hp-=3;G.flash=.2;txt(p.x,p.y-30,'❄ -3','#8fc8ff',15);if(p.hp<=0){p.hp=0;playerDied()}}}}
 }else G.cold=Math.max(0,G.cold-dt*.6);

    if(m.atk<=0){m.atk=df.cd;m.sw=.25;damageBld(b,df.dmg*m.dm*(df.bm||1)*(df.range?0:1)*(m.aura>0?1.2:1));sfx('bhit')}
   }
  }
 }
 for(let i=0;i<act.length;i++){const a=act[i];if(a.dead)continue;for(let j=i+1;j<act.length;j++){const b=act[j];if(b.dead)continue;
  const dx=b.x-a.x,dy=b.y-a.y,m=a.r+b.r-2;if(Math.abs(dx)>m||Math.abs(dy)>m)continue;const d=Math.hypot(dx,dy);
  if(d<m&&d>.01){const k=(m-d)/d*.5;a.x-=dx*k;a.y-=dy*k;b.x+=dx*k;b.y+=dy*k}}}
 let alive=0;for(const m of MOBS)if(!m.dead)alive++;
 if(alive<MOBS.length*.85||MOBS.length-alive>20)MOBS=MOBS.filter(m=>!m.dead);
}

/* ===================== ПОСТРОЙКИ: ЛОГИКА ===================== */
function updateBuildings(dt){
 const zs=[];for(const m of MOBS)if(!m.dead&&(m.def.ai==='z'||m.def.ai==='wolf'))zs.push(m);
 for(const b of BLD){
  if(b.dead)continue;const d=b.def;
  b.hit=Math.max(0,b.hit-dt);b.t+=dt;b.cd-=dt;b.pop=Math.max(0,b.pop-dt);b.fl=Math.max(0,b.fl-dt);b.sw=Math.max(0,b.sw-dt);
  const pd=Math.hypot(b.x-P.x,b.y-P.y);
  switch(d.k){
   case 'prod':
    b.pt+=dt;
    if(b.pt>=d.prod.every){b.pt=0;P.res[d.prod.res]+=d.prod.n;G.gathered+=d.prod.n;if(pd<700)txt(b.x,b.y-34,'+'+d.prod.n,RCOL[d.prod.res],15);b.pop=.2;if(d.prod.xp){addXp(d.prod.xp);if(pd<700)txt(b.x,b.y-52,'+'+d.prod.xp+' XP','#ffd36e',13)}}
    if(d.kind==='forge'&&Math.random()<dt*2.5)PARTS.push({x:b.x+14,y:b.y-16,vx:rand(-6,6),vy:-28,life:1.1,max:1.1,s:rand(6,10),col:'rgba(90,85,95,.6)',k:1});
    break;
   case 'fire':
    for(const m of zs)if(Math.hypot(m.x-b.x,m.y-b.y)<80+m.r)igniteMob(m,14,dt);
    if(pd<115)P.hp=Math.min(P.maxhp,P.hp+1.5*dt);
    if(Math.random()<dt*7)sparkFire(b.x+rand(-8,8),b.y-4);
    break;
   case 'torch':if(Math.random()<dt*4)sparkFire(b.x+rand(-3,3),b.y-14);break;
   case 'pad':if(pd<46)P.hp=Math.min(P.maxhp,P.hp+d.heal*dt);if(pd<46&&P.hp<P.maxhp&&Math.random()<dt*3)PARTS.push({x:b.x+rand(-18,18),y:b.y+rand(-10,10),vx:0,vy:-34,life:.7,max:.7,s:5,col:'#8ff08f',k:2});break;
   case 'spike':
    if(b.cd<=0){let hit=false;for(const m of zs){if(Math.abs(m.x-b.x)<34+m.r&&Math.abs(m.y-b.y)<34+m.r){damageMob(m,d.dmg,Math.atan2(m.y-b.y,m.x-b.x),70,true);hit=true}}
     if(hit){b.cd=.55;b.sw=.15;sfx('spike')}}
    break;
   case 'pit':
    for(const m of zs){if(m.def.boss||m.trap>0)continue;if(Math.hypot(m.x-b.x,m.y-b.y)<30){m.trap=3;b.uses--;puff(b.x,b.y,4,'rgba(120,90,60,.6)');if(b.uses<=0){destroyBld(b,true);break}}}
    break;
   case 'mine':
    for(const m of zs){if(Math.hypot(m.x-b.x,m.y-b.y)<m.r+22){destroyBld(b,true);boom(b.x,b.y,135,170,0,0,true);break}}
    break;
   case 'bot':{
    b.fT-=dt;
    if(!b.tg||b.tg.dead||b.fT<=0){b.fT=.9;b.tg=findBotTarget(b)}
    if(b.tg){const a=Math.atan2(b.tg.y-b.y,b.tg.x-b.x);b.ang+=angDiff(b.ang,a)*Math.min(1,dt*8);b.work+=dt;if(b.work>=d.bot.every){b.work=0;botHit(b,pd)}}
    else b.work=0;
    break}
   case 'guard':{
    const bf=b.gl.length;b.gl=b.gl.filter(g=>!g.dead);
    if(b.gl.length<bf&&!b.fillInit)b.resp=d.guard.resp;
    if(b.gl.length<d.guard.n){b.resp-=dt;if(b.resp<=0){spawnGuard(b);b.resp=b.fillInit?1.2:d.guard.resp}}
    else b.fillInit=false;
    break}
   case 'turret':case 'ballista':case 'flame':{
    let tg=null,bd=d.range+1;
    for(const m of zs){const dd=Math.hypot(m.x-b.x,m.y-b.y)-m.r;if(dd<bd){bd=dd;tg=m}}
    if(tg){
     const a=Math.atan2(tg.y-b.y,tg.x-b.x);b.ang+=angDiff(b.ang,a)*Math.min(1,dt*10);
     if(b.cd<=0){
      b.cd=d.cd;b.fl=.09;
      if(d.k==='flame'){
       for(const m of zs){const dx=m.x-b.x,dy=m.y-b.y,dd=Math.hypot(dx,dy)-m.r;if(dd<d.range&&Math.abs(angDiff(b.ang,Math.atan2(dy,dx)))<.5)igniteMob(m,d.dmg/d.cd,d.cd)}
       for(let i=0;i<4;i++){const aa=b.ang+rand(-.25,.25),s=rand(150,260);PARTS.push({x:b.x+Math.cos(b.ang)*30,y:b.y+Math.sin(b.ang)*30,vx:Math.cos(aa)*s,vy:Math.sin(aa)*s,life:.4,max:.4,s:rand(5,9),col:Math.random()<.5?'#ff8a2a':'#ffd35a',k:2})}
      }else if(d.k==='ballista'){shoot(b.x+Math.cos(b.ang)*30,b.y+Math.sin(b.ang)*30,b.ang,{spd:820,dmg:d.dmg,life:d.range/820,own:'t',pierce:1,k:'bolt',r:8});sfx('shoot')}
      else{shoot(b.x+Math.cos(b.ang)*28,b.y+Math.sin(b.ang)*28,b.ang,{spd:760,dmg:d.dmg,life:d.range/760,own:'t',k:'bullet',r:5});sfx('shoot')}
     }
    }
    break}
  }
 }
 if(G.bd){BLD=BLD.filter(b=>!b.dead);G.bd=false}
}
function updateProj(dt){
 for(const p of PROJ){
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
  if(p.fire&&Math.random()<dt*40)PARTS.push({x:p.x,y:p.y,vx:rand(-20,20),vy:rand(-20,20),life:.35,max:.35,s:rand(4,8),col:Math.random()<.5?'#ff8a2a':'#ffd35a',k:2});
  if(p.own==='z'&&p.k==='acid'&&Math.random()<dt*20)PARTS.push({x:p.x,y:p.y,vx:0,vy:0,life:.3,max:.3,s:5,col:'#9be15d',k:0});
  if(p.x<0||p.y<0||p.x>MAP||p.y>MAP)p.life=0;
  if(p.own==='z'){
   for(const g of GUARDS){if(!g.dead&&p.life>0&&Math.hypot(g.x-p.x,g.y-p.y)<g.r+p.r){hurtGuard(g,p.dmg,null);p.life=0;burst(p.x,p.y,'#9be15d',6,100,.3,3)}}
   if(Math.hypot(P.x-p.x,P.y-p.y)<P.r+p.r){hurtPlayer(p.dmg);if(p.k==='ice')P.slowT=2.5;p.life=0;burst(p.x,p.y,'#9be15d',8,120,.4,4)}
   else grid.query(p.x,p.y,60,o=>{if(p.life>0&&o.cls==='bld'&&!o.dead&&!o.def.flat&&Math.abs(o.x-p.x)<32+p.r&&Math.abs(o.y-p.y)<32+p.r){damageBld(o,p.dmg*1.6);p.life=0;burst(p.x,p.y,'#9be15d',8,120,.4,4)}});
  }else{
   for(const m of MOBS){
    if(m.dead||p.life<=0)continue;
    if((p.own==='t'||p.own==='g')&&m.def.ai==='pas')continue;
    if(p.hl.includes(m))continue;
    if(Math.hypot(m.x-p.x,m.y-p.y)<m.r+p.r){
     p.hl.push(m);damageMob(m,p.dmg,p.a,90,p.own!=='z');
     if(p.chain)chainLightning(m,p.dmg*.7,p.chain);
     if(p.ice){iceBurst(p.x,p.y,p.aoe||60,p.dmg*.5);p.life=0;p.aoe=0}
     else if(p.aoe){boom(p.x,p.y,p.aoe,p.dmg*.6,0,0,true);p.aoe=0;p.life=0}
     else if(!p.pierce)p.life=0;
    }
   }
  }
  if(p.life<=0&&p.aoe&&p.own!=='z'&&!p.ice)boom(p.x,p.y,p.aoe,p.dmg*.6,0,0,true);
  else if(p.life<=0&&p.ice&&p.aoe)iceBurst(p.x,p.y,p.aoe,p.dmg*.5);
 }
 PROJ=PROJ.filter(p=>p.life>0);
}
function updateDrops(dt){
 for(const d of DROPS){
  d.t+=dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.vx*=Math.exp(-4*dt);d.vy*=Math.exp(-4*dt);
  const dd=Math.hypot(P.x-d.x,P.y-d.y);
  if(d.t>.35&&dd<120){const a=Math.atan2(P.y-d.y,P.x-d.x),s=360+(120-dd)*3;d.x+=Math.cos(a)*s*dt;d.y+=Math.sin(a)*s*dt}
  if(d.t>.25&&dd<26){P.res[d.res]+=d.n;G.gathered+=d.n;txt(P.x,P.y-30,'+'+d.n,RCOL[d.res],16);sfx('pickup');d.dead=true}
  if(d.t>45)d.dead=true;
 }
 DROPS=DROPS.filter(d=>!d.dead);
}
function updateFX(dt){
 for(const p of PARTS){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k===0){p.vx*=Math.exp(-3*dt);p.vy*=Math.exp(-3*dt)}}
 PARTS=PARTS.filter(p=>p.life>0);
 for(const t of TEXTS){t.t+=dt;t.y-=38*dt}
 TEXTS=TEXTS.filter(t=>t.t<t.max);
 for(const o of RES)if(o.shake>0)o.shake=Math.max(0,o.shake-dt);
 G.shake=Math.max(0,G.shake-dt*30);G.flash=Math.max(0,G.flash-dt*1.6);
}

/* ===================== ДЕНЬ, НОЧЬ, ЗОМБИ ===================== */
function updateClock(dt){
 G.H+=dt*24/DAY_LEN;G.hour=G.H%24;G.day=Math.floor((G.H-6)/24)+1;
 const h=G.hour;let n=0;
 if(h>=21||h<4.5)n=1;else if(h>=18&&h<21)n=(h-18)/3;else if(h>=4.5&&h<6.5)n=1-(h-4.5)/2;
 G.night=n*n*(3-2*n);
}
function spawnPoint(){
 const R=Math.hypot(W,H)/(2*S)+70;
 for(let i=0;i<14;i++){
  const a=rand(0,TAU),d=R+rand(0,260),x=P.x+Math.cos(a)*d,y=P.y+Math.sin(a)*d;
  if(x<80||y<80||x>MAP-80||y>MAP-80||inWater(x,y))continue;
  return{x,y};
 }
 return null;
}
function spawnZombie(type){
 const q=spawnPoint();if(!q)return false;
 const n=G.nightNum,bl=G.blood?1.3:1;
 const m=mkMob(type,q.x,q.y,(1+.14*(n-1))*bl,1+.08*(n-1));
 if(type==='boss'){m.hp=m.maxhp=m.def.hp*(1+.12*Math.max(0,n-5))}
 return true;
}
function startNight(key){
 G.inNight=true;G.nightKey=key;G.nightNum=key+1;
 G.blood=G.nightNum%3===0;
 G.budget=G.budgetTot=Math.round((10+G.nightNum*7+P.age*2)*(G.blood?1.3:1));
 G.nextSpawn=3;G.bossDone=!(G.nightNum%5===0);
 if(G.blood)banner('🩸 Кровавая луна · ночь '+G.nightNum,'Зомби сильнее и их больше!');
 else banner('🌙 Ночь '+G.nightNum,'Зомби выходят из тумана. Держись у стен!');
 sfx('night');
}
function endNight(){
 G.inNight=false;
 if(G.nightNum>0&&!G.over){
  G.nights++;
  for(const m of MOBS)if(!m.dead&&m.def.ai==='z'&&!m.noBurn&&!m.def.lair&&m.burn===undefined)m.burn=rand(.6,7);
  const xp=40+G.nightNum*25;addXp(xp);
  banner('☀️ Рассвет!','Ночь '+G.nightNum+' пережита · +'+xp+' XP · зомби сгорают на солнце');sfx('dawn');
 }
 G.blood=false;
}
function updateDirector(dt){
 for(const L of LAIRS){if(L.boss&&L.boss.dead&&!L.dead){L.dead=true;L.respDay=G.day+4}if(L.dead&&G.day>=L.respDay)spawnLairBoss(L)}
 const h=G.hour,isN=(h>=20||h<5.5)&&G.H>=20;
 const key=Math.floor((G.H-20)/24);
 if(isN&&!G.inNight)startNight(key);
 else if(!isN&&G.inNight)endNight();
 if(!G.inNight)return;
 if(!G.bossDone&&G.hour<5&&G.hour>=.5&&G.hour<5.4){G.bossDone=true;if(spawnZombie('boss')){banner('👑 Король зомби','Он ломает стены. Убей его — получишь награду!');sfx('moan');G.shake=10}}
 G.nextSpawn-=dt;
 let alive=0;for(const m of MOBS)if(!m.dead&&m.def.ai==='z'&&!m.noBurn&&!m.def.lair)alive++;
 const cap=Math.min(90,10+G.nightNum*4);
 if(G.budget>0&&G.nextSpawn<=0&&alive<cap){
  const n=G.nightNum,opts=ZW.filter(z=>z[2]<=n&&z[3]<=G.budget);
  if(opts.length){
   let tot=0;for(const o of opts)tot+=o[1];
   let r=Math.random()*tot,ch=opts[0];for(const o of opts){r-=o[1];if(r<=0){ch=o;break}}
   const grp=n>=3&&Math.random()<.3?irand(2,3):1;
   for(let i=0;i<grp&&G.budget>=ch[3];i++){if(spawnZombie(ch[0]))G.budget-=ch[3];else break}
  }else G.budget=0;
  G.nextSpawn=clamp(95/G.budgetTot,.4,6)*rand(.6,1.3);
  if(!G.flags.zsee){G.flags.zsee=1;toast('Зомби! Бей их и прячься за стенами')}
 }
}
function updateHints(){
 const f=G.flags;
 if(!f.dusk&&G.hour>=17.2&&G.H<24){f.dusk=1;toast('Скоро ночь! Стены 🧱 и костёр 🔥 — кнопка «Постройки»',4200)}
 if(!f.age2&&P.age>=2){f.age2=1}
}
function update(dt){
 G.t+=dt;
 updateClock(dt);updateDirector(dt);
 updatePlayer(dt);
 if(G.over){updateMobs(dt);updateFX(dt);return}
 updateMobs(dt);updateBuildings(dt);updateGuards(dt);updateProj(dt);updateDrops(dt);updateFX(dt);updateHints();
 if(MODE.t)updateGhost();
 // камера
 const k=1-Math.exp(-9*dt);cam.x+=(P.x-cam.x)*k;cam.y+=(P.y-cam.y)*k;
}

/* ===================== ЧТО ЕЩЁ: сундуки, молнии, лёд, роботы, стражи, расчистка ===================== */
function removeRes(o){o.dead=true;grid.remove(o);const i=RES.indexOf(o);if(i>=0)RES.splice(i,1)}
function openChest(o){
 removeRes(o);
 const ks=RKEYS.slice().sort(()=>Math.random()-.5).slice(0,3),mul=1+P.age*.3;
 for(const r of ks){const n=Math.round(irand(10,24)*mul);P.res[r]+=n;G.gathered+=n;txt(o.x+rand(-20,20),o.y-30+rand(-14,0),'+'+n,RCOL[r],16)}
 addXp(25+P.age*5);burst(o.x,o.y,'#f2c14e',16,200,.6,5);ringFx(o.x,o.y,60,'#f2c14e');sfx('ageup');toast('Сундук открыт!');
}
function doClear(){
 const x=MODE.gx*CELL,y=MODE.gy*CELL,list=[];
 grid.query(x,y,150,o=>{if(o.cls==='res'&&!o.dead&&o.type!=='chest'&&Math.hypot(o.x-x,o.y-y)<90)list.push(o)});
 if(!list.length){toast('Здесь нечего расчищать');sfx('nope');return}
 if(!canPay(CLEAR.cost)){toast('Не хватает ресурсов');sfx('nope');return}
 pay(CLEAR.cost);
 for(const o of list){burst(o.x,o.y,'#b98550',8,160,.5,5);puff(o.x,o.y,2);removeRes(o)}
 ringFx(x,y,90,'#e8d6a8');sfx('crash');G.shake=Math.max(G.shake,4);toast('Расчищено навсегда: '+list.length);
}
function chainLightning(from,dmg,n){
 let cur=from;const hit=[from];
 for(let i=0;i<n;i++){
  let best=null,bd=230;
  for(const m of MOBS){if(m.dead||hit.includes(m)||m.def.ai==='pas')continue;const d=Math.hypot(m.x-cur.x,m.y-cur.y);if(d<bd){bd=d;best=m}}
  if(!best)break;
  PARTS.push({x:cur.x,y:cur.y,x2:best.x,y2:best.y,vx:0,vy:0,life:.22,max:.22,s:4,col:'#ffe85a',k:4});
  damageMob(best,dmg,Math.atan2(best.y-cur.y,best.x-cur.x),60,true);hit.push(best);cur=best;dmg*=.85;
 }
}
function iceBurst(x,y,r,dmg){
 ringFx(x,y,r,'#bfeaff');burst(x,y,'#bfeaff',14,200,.5,5);sfx('crash');
 for(const m of MOBS){if(m.dead||m.def.ai==='pas')continue;const d=Math.hypot(m.x-x,m.y-y);if(d<r+m.r){m.slow=3;damageMob(m,dmg,Math.atan2(m.y-y,m.x-x),80,true)}}
}
function findBotTarget(b){
 const bt=b.def.bot;let best=null,bd=bt.range;
 grid.query(b.x,b.y,bt.range+40,o=>{if(o.cls==='res'&&!o.dead&&bt.types.includes(o.type)){const d=Math.hypot(o.x-b.x,o.y-b.y);if(d<bd){bd=d;best=o}}});
 return best;
}
function botHit(b,pd){
 const tg=b.tg,bt=b.def.bot;if(!tg||tg.dead)return;
 const res=tg.def.res;let n=bt.n;if(res==='gold'||res==='iron')n=Math.max(1,Math.ceil(n/2));
 P.res[res]+=n;G.gathered+=n;tg.shake=.2;b.pop=.12;addXp(1);
 burst(tg.x,tg.y,RCOL[res],3,90,.3,3);b.hits=(b.hits||0)+1;
 if(pd<650&&b.hits%3===0)txt(tg.x,tg.y-tg.r,'+'+n,RCOL[res],14);
 if(pd<420&&Math.random()<.4)sfx(res==='wood'?'chop':res==='food'?'pick':'mine');
}
function spawnGuard(b){
 const gd=b.def.guard;
 const g={cls:'guard',post:b,kind:gd.kind,x:b.x+rand(-30,30),y:b.y+52,vx:0,vy:0,r:16,hp:gd.hp,maxhp:gd.hp,dmg:gd.dmg,cd:gd.cd,range:gd.range||0,atk:0,face:PI/2,anim:rand(0,9),hurt:0,sw:0,dead:false};
 GUARDS.push(g);b.gl.push(g);ringFx(g.x,g.y,50,'#9fd8ff');
}
function updateGuards(dt){
 const zs=[];for(const m of MOBS)if(!m.dead&&(m.def.ai==='z'||m.def.ai==='wolf'))zs.push(m);
 for(const g of GUARDS){
  if(g.dead)continue;
  g.anim+=dt;g.atk-=dt;g.hurt=Math.max(0,g.hurt-dt);g.sw=Math.max(0,g.sw-dt);
  const po=g.post;if(po.dead){g.dead=true;continue}
  let tg=null,bd=520;
  for(const m of zs){const dd=Math.hypot(m.x-g.x,m.y-g.y);if(dd<bd&&Math.hypot(m.x-po.x,m.y-po.y)<580){bd=dd;tg=m}}
  let mx=0,my=0,sp=g.kind==='knight'?105:g.kind==='bow'?112:125;
  const home=Math.hypot(po.x-g.x,po.y-g.y);
  if(tg){
   const a=Math.atan2(tg.y-g.y,tg.x-g.x);g.face=a;
   if(g.range){
    if(bd<g.range*.45){mx=-Math.cos(a);my=-Math.sin(a)}else if(bd>g.range*.9){mx=Math.cos(a);my=Math.sin(a)}
    if(g.atk<=0&&bd<g.range){g.atk=g.cd;shoot(g.x,g.y,a,{spd:700,dmg:g.dmg,life:g.range/700,own:'g',k:'arrow',r:5});sfx('shoot')}
   }else{
    if(bd>tg.r+g.r+12){mx=Math.cos(a);my=Math.sin(a)}
    else if(g.atk<=0){g.atk=g.cd;g.sw=.2;damageMob(tg,g.dmg,a,120,true)}
   }
  }else if(home>120){const a=Math.atan2(po.y-g.y,po.x-g.x);mx=Math.cos(a);my=Math.sin(a);g.face=a;sp*=.8}
  else g.hp=Math.min(g.maxhp,g.hp+3*dt);
  const k=1-Math.exp(-10*dt);g.vx+=(mx*sp-g.vx)*k;g.vy+=(my*sp-g.vy)*k;
  g.x+=g.vx*dt;g.y+=g.vy*dt;collide(g,true);
  g.x=clamp(g.x,30,MAP-30);g.y=clamp(g.y,30,MAP-30);
 }

const OL='#2e2a33';
function circ(x,y,r,f,lw){c.beginPath();c.arc(x,y,r,0,TAU);if(f){c.fillStyle=f;c.fill()}if(lw===undefined)lw=3;if(lw){c.lineWidth=lw;c.strokeStyle=OL;c.stroke()}}
function rr(x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function rect(x,y,w,h,f,lw,r){if(lw===undefined)lw=3;rr(x,y,w,h,r===undefined?5:r);if(f){c.fillStyle=f;c.fill()}if(lw){c.lineWidth=lw;c.strokeStyle=OL;c.stroke()}}
function poly(pts,f,lw){if(lw===undefined)lw=3;c.beginPath();c.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);c.closePath();if(f){c.fillStyle=f;c.fill()}if(lw){c.lineWidth=lw;c.strokeStyle=OL;c.stroke()}}
function line(x1,y1,x2,y2,col,lw){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=col;c.lineWidth=lw;c.stroke()}
function ell(x,y,rx,ry,f){c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);c.fillStyle=f;c.fill()}
function hpBar(x,y,w,fr,col){c.fillStyle='rgba(30,25,38,.85)';rr(x-w/2-2,y-4,w+4,8,4);c.fill();c.fillStyle=col||(fr>.5?'#7bd36a':fr>.25?'#f0c040':'#e4545c');rr(x-w/2,y-2,Math.max(2,w*clamp(fr,0,1)),4,2);c.fill()}

function drawBld(b,t){
 const d=b.def;
 c.save();c.translate(b.x,b.y);
 if(b.hit>0)c.translate(rand(-2,2),rand(-2,2));
 const s=b.pop>0?1+Math.sin(b.pop*PI/.3)*.12:1;if(s!==1)c.scale(s,s);
 if(!d.flat&&!d.circle)ell(4,30,28,7,'rgba(0,0,0,.16)');
 bldArt(b,t);
 c.restore();
 if(b.hp<b.maxhp-.5)hpBar(b.x,b.y-(d.circle?d.circle+12:40),38,b.hp/b.maxhp);
}

let AC=null,NB=null;const lastS={};
function initAudio(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*.6,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;NB=b}if(AC.state==='suspended')AC.resume()}catch(e){AC=null}}
function tone(f,d,type,vol,slide,delay){if(!AC||!SET.sfx)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03)}

  case 'chop':noiseS(.07,.09,900);tone(160,.06,'square',.04,-60);break;
  case 'mine':tone(520,.05,'square',.04,-200);noiseS(.05,.07,2500);break;
  case 'pick':tone(600,.07,'sine',.05,300);break;

  case 'swing':noiseS(.08,.035,1500);break;
  case 'zhit':noiseS(.06,.08,500);tone(120,.07,'sawtooth',.05,-40);break;
  case 'zdie':tone(220,.28,'sawtooth',.06,-160);break;
  case 'moan':tone(rand(70,110),.7,'sawtooth',.025,-25);break;
  case 'hurt':tone(190,.18,'square',.07,-110);break;

function bestWeapon(){const own=WEAPONS.filter(w=>P.own[w.id]).sort((a,b)=>b.age-a.age);return own.length?own[0].id:'fist'}

 if(t==='w'){if(id==='fist')return;delete P.own[id];if(P.weapon===id)P.weapon=bestWeapon()}
 else{const d=AID[id];delete P.own[id];if(P.gear[d.slot]===id)P.gear[d.slot]=null}

function setAge(n){n=clamp(n,1,10);P.age=n;P.xp=0;banner('🛠 Эпоха '+n,AGES[n-1]);sfx('ageup')}
function adminDo(a,v){
 G.cheated=true;
 if(a==='res'){P.res[v]+=admN}
 else if(a==='all'){for(const r of RKEYS)P.res[r]+=admN}
 else if(a==='age'){setAge(+v)}
 else if(a==='agep'){if(P.age<10){G.ageQ+=0;addXp(Math.max(1,xpNeed(P.age)-P.xp))}}
 else if(a==='heal'){P.hp=P.maxhp}
 else if(a==='maxhp'){P.maxhp+=100;P.hp=P.maxhp}
 else if(a==='god'){P.god=!P.god}
 else if(a==='items'){for(const w of WEAPONS)P.own[w.id]=1;for(const x of ARMOR)P.own[x.id]=1}
 else if(a==='night'){if(!(G.hour>=20||G.hour<5.5))G.H=Math.floor(G.H/24)*24+20}
 else if(a==='day'){if(G.hour>=17.5||G.hour<7)G.H+=(7-G.hour+24)%24}
 else if(a==='kill'){for(const m of MOBS)if(!m.dead&&m.def.ai==='z'&&!m.def.lair)killMob(m,false)}
 else if(a==='boss'){const m=mkMob('boss',P.x+Math.cos(P.face)*260,P.y+Math.sin(P.face)*260,1,1);m.noBurn=true}
 else if(a==='tp'){if(v==='home'){P.x=SP.x;P.y=SP.y}else{const L=LAIRS.find(l=>l.type===v);if(L){P.x=L.x+300;P.y=L.y}}P.vx=P.vy=0;cam.x=P.x;cam.y=P.y}
}

 const s=196,cvs=document.createElement('canvas');cvs.width=cvs.height=s;const x=cvs.getContext('2d'),px=MAP/s;
 for(let j=0;j<s;j+=2)for(let i=0;i<s;i+=2){
  const wx=(i+1)*px,wy=(j+1)*px;let col;
  if(inWater(wx,wy))col='#4f9fd8';else{const b=biomeAt(wx,wy);col=b==='snow'?'#e6eff5':b==='desert'?'#e2cf84':'#8fcf62'}
  x.fillStyle=col;x.fillRect(i,j,2,2);
 }

 x.fillStyle='#ffd36e';x.beginPath();x.arc(P.x*k,P.y*k,5,0,TAU);x.fill();x.strokeStyle='#2e2a33';x.lineWidth=2;x.stroke();

  const x=MODE.gx*CELL,y=MODE.gy*CELL,ok=!MODE.why;
  c.save();c.translate(x,y);
  if(MODE.t==='b'){c.globalAlpha=.65;bldArt({def:MODE.def,hp:1,maxhp:1,v:0,ang:P.face,t:1,cd:1,fl:0,sw:0,pop:0,uses:4,tg:null},t);c.globalAlpha=1;
   if(MODE.def.range){c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=2;c.setLineDash([8,8]);c.beginPath();c.arc(0,0,MODE.def.range,0,TAU);c.stroke();c.setLineDash([])}
   if(MODE.def.bot){c.strokeStyle='rgba(125,255,176,.45)';c.lineWidth=2;c.setLineDash([8,8]);c.beginPath();c.arc(0,0,MODE.def.bot.range,0,TAU);c.stroke();c.setLineDash([])}}
  if(MODE.t==='c'){c.beginPath();c.arc(0,0,90,0,TAU);c.fillStyle=ok?'rgba(255,190,80,.25)':'rgba(255,70,70,.28)';c.fill();c.lineWidth=3;c.strokeStyle=ok?'#ffbe50':'#ff6b6b';c.setLineDash([10,8]);c.stroke();c.setLineDash([])}
  else{rr(-32,-32,64,64,6);c.fillStyle=ok?'rgba(90,255,130,.22)':'rgba(255,70,70,.32)';c.fill();c.lineWidth=3;c.strokeStyle=ok?'#8ff08f':'#ff6b6b';c.stroke()}
  if(MODE.t==='d'){c.fillStyle='#fff';c.font='bold 30px sans-serif';c.textAlign='center';c.fillText('✕',0,10)}
  c.restore();
 }
 c.textAlign='center';c.lineJoin='round';
 for(const tx of TEXTS){const a=Math.min(1,(tx.max-tx.t)*3);c.globalAlpha=a;c.font='900 '+tx.sz+'px "Trebuchet MS",sans-serif';c.lineWidth=4;c.strokeStyle=OL;c.strokeText(tx.s,tx.x,tx.y);c.fillStyle=tx.col;c.fillText(tx.s,tx.x,tx.y)}
 c.globalAlpha=1;
 drawNight();
 c.setTransform(dpr,0,0,dpr,0,0);
 if(G.flash>0){const g=c.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.hypot(W,H)*.6);g.addColorStop(0,'rgba(220,30,30,0)');g.addColorStop(1,`rgba(220,30,30,${Math.min(.7,G.flash)})`);c.fillStyle=g;c.fillRect(0,0,W,H)}
 if(G.cold>.05){const g=c.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.hypot(W,H)*.6);g.addColorStop(0,'rgba(120,190,255,0)');g.addColorStop(1,`rgba(120,190,255,${G.cold*.45})`);c.fillStyle=g;c.fillRect(0,0,W,H)}
 if(P.hp<P.maxhp*.25&&!G.over){const a=.12+.1*Math.sin(t*6);const g=c.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.hypot(W,H)*.6);g.addColorStop(0,'rgba(200,0,0,0)');g.addColorStop(1,`rgba(200,0,0,${a*2})`);c.fillStyle=g;c.fillRect(0,0,W,H)}
 if(G.over){c.fillStyle='rgba(90,0,0,.35)';c.fillRect(0,0,W,H);G.overT+=.016}
 if(G.started&&!G.over)drawBossBar();
 if(G.started&&!G.paused&&!G.over)drawSticks();
}

/* ===================== ЗАПУСК ===================== */
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);S=clamp(Math.min(W,H)/700,.5,1.3);dk.width=Math.ceil(W/2);dk.height=Math.ceil(H/2)}
let lastTs=0,fc=0;
function frame(ts){
 requestAnimationFrame(frame);
 let dt=(ts-lastTs)/1000;lastTs=ts;if(!(dt>0))dt=.016;if(dt>.05)dt=.05;
 if(G.started&&!G.paused)update(dt);else G.t+=dt;
 if(!G.started){cam.x=P.x+Math.sin(G.t*.2)*40;cam.y=P.y+Math.cos(G.t*.17)*40}
 render();
 if(++fc%4===0)hudTick();
}
function init(){
 resize();addEventListener('resize',resize);
 newGame();buildHud();applySet();showStart();
 requestAnimationFrame(frame);
}
init();
